{% extends 'base.html' %}

{% block title %}Requête invalide | Toolbox Everything{% endblock %}

{% block content %}
<section class="error-page">
    <div>
        <div class="error-page__code error-page__code--warn">400</div>
        <h1 class="error-page__title">Requête invalide</h1>
        <p class="error-page__text">
            La requête envoyée au serveur est invalide ou mal formatée. Vérifiez les
            données et réessayez.
        </p>
        <div class="error-page__actions">
            <a href="{{ url_for('index') }}" class="tool-btn tool-btn--indigo">
                <i class="fas fa-house text-xs" aria-hidden="true"></i>
                <span>Retour à l'accueil</span>
            </a>
        </div>
    </div>
</section>
{% endblock %}
