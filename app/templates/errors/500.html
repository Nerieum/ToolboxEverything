{% extends 'base.html' %}

{% block title %}Erreur serveur | Toolbox Everything{% endblock %}

{% block content %}
<section class="error-page">
    <div>
        <div class="error-page__code error-page__code--err">500</div>
        <h1 class="error-page__title">Erreur serveur</h1>
        <p class="error-page__text">
            Une erreur inattendue est survenue sur le serveur. Réessayez dans un moment.
        </p>
        <div class="error-page__actions">
            <a href="{{ url_for('index') }}" class="tool-btn tool-btn--indigo">
                <i class="fas fa-house text-xs" aria-hidden="true"></i>
                <span>Retour à l'accueil</span>
            </a>
        </div>
    </div>
</section>
{% endblock %}
