{% extends 'base.html' %}

{% block title %}Méthode non autorisée | Toolbox Everything{% endblock %}

{% block content %}
<section class="error-page">
    <div>
        <div class="error-page__code error-page__code--warn">405</div>
        <h1 class="error-page__title">Méthode non autorisée</h1>
        <p class="error-page__text">
            La méthode que vous essayez d'utiliser n'est pas autorisée pour cette ressource.
        </p>
        <div class="error-page__actions">
            <a href="{{ url_for('index') }}" class="tool-btn tool-btn--indigo">
                <i class="fas fa-house text-xs" aria-hidden="true"></i>
                <span>Retour à l'accueil</span>
            </a>
        </div>
    </div>
</section>
{% endblock %}
