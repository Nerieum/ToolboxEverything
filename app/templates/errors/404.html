{% extends 'base.html' %}

{% block title %}Page introuvable | Toolbox Everything{% endblock %}

{% block content %}
<section class="error-page">
    <div>
        <div class="error-page__code">404</div>
        <h1 class="error-page__title">Page introuvable</h1>
        <p class="error-page__text">
            La page que vous recherchez n'existe pas ou a été déplacée.
        </p>
        <div class="error-page__actions">
            <a href="{{ url_for('index') }}" class="tool-btn tool-btn--indigo">
                <i class="fas fa-house text-xs" aria-hidden="true"></i>
                <span>Retour à l'accueil</span>
            </a>
        </div>
    </div>
</section>
{% endblock %}
